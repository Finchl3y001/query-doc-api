version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: local_postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - local_postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: querydoc
    restart: always
    ports:
      - "8000:8000"
    environment:
      - SYNC_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - ASYNC_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - SECRET_KEY=${SECRET_KEY}
      - REFRESH_SECRET_KEY=${REFRESH_SECRET_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - ALGORITHM = ${ALGORITHM}
      - ACCESS_TOKEN_EXPIRE_MINUTES = ${ACCESS_TOKEN_EXPIRE_MINUTES} 
      - REFRESH_TOKEN_EXPIRE_DAYS = = ${REFRESH_TOKEN_EXPIRE_DAYS}
    depends_on:
      - db

volumes:
  local_postgres_data:
